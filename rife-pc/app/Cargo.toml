[package]
name = "rife-pc"
version = "1.0.0"
edition = "2021"
description = "Windows CLI and GUI for RIFE frame interpolation"
publish = false

[[bin]]
name = "rife-pc"
path = "src/main.rs"

[features]
default = []
ncnn = []
gui = ["dep:eframe", "dep:rfd"]

[dependencies]
rife-guards = { path = "../guards" }
clap = { version = "=4.5.23", features = ["derive"] }
anyhow = "=1.0.93"
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.133"
rayon = "=1.10.0"
libloading = "=0.8.6"
eframe = { version = "0.29", optional = true }
rfd = { version = "0.15", optional = true }

name: RIFE60GhostGuard

options:
  bundleIdPrefix: com.za
  deploymentTarget:
    iOS: "16.0"

packages:
  RifeMetal:
    path: Vendor/rife-metal
  DrawThings:
    path: Vendor/draw-things-community
  AVIF:
    url: https://github.com/awxkee/avif.swift.git
    exactVersion: 2.1.2

targets:
  RIFE60GhostGuard:
    type: application
    platform: iOS
    info:
      path: Info.plist
      properties:
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: org.matroska.mkv
            UTTypeDescription: Matroska Video
            UTTypeConformsTo:
              - public.data
              - public.movie
            UTTypeTagSpecification:
              public.filename-extension:
                - mkv
                - mka
                - mk3d
                - webm
              public.mime-type:
                - video/x-matroska
                - video/webm
    sources:
      - path: .
        includes:
          - "*.swift"
          - "*.mm"
          - "X265PresetTranscode.c"
      - path: Vendor/minimax-h3
        includes:
          - "*.c"
          - "*.m"
          - "*.metal"
      - path: Vendor/h3-gguf
        includes:
          - "*.c"
      - path: Assets.xcassets
      - path: Models/DeepCreamBar.mlpackage
      - path: Models/DeepCreamMosaic.mlpackage
      - path: Models/VACEAnimeSeg.mlpackage
        type: folder
        buildPhase: resources
      - path: Models/h3-tier1-manifest.json
        type: file
        buildPhase: resources
      - path: Models/h3-tokenizer.json
        type: file
        buildPhase: resources
    dependencies:
      - package: RifeMetal
        product: RifeMetal
      - package: DrawThings
        product: _MediaGenerationKit
      - package: DrawThings
        product: DrawThingsCLILib
      - package: DrawThings
        product: DataModels
      - package: AVIF
        product: avif
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.za.rife60ghostguard
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/RIFE60GhostGuard-Bridging-Header.h"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)"
          - "$(SRCROOT)/Vendor/ffmpeg-ios/include"
          - "$(SRCROOT)/Vendor/minimax-h3"
          - "$(SRCROOT)/Vendor/h3-gguf"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/ffmpeg-ios/lib"
        OTHER_LDFLAGS:
          - "-framework"
          - "Metal"
          - "-framework"
          - "Vision"
          - "-framework"
          - "Foundation"
          - "-framework"
          - "Accelerate"
          - "-lc++"
          - "-lz"
          - "-Wl,-force_load,$(SRCROOT)/Vendor/ffmpeg-ios/lib/libavformat.a"
          - "-Wl,-force_load,$(SRCROOT)/Vendor/ffmpeg-ios/lib/libavcodec.a"
          - "-Wl,-force_load,$(SRCROOT)/Vendor/ffmpeg-ios/lib/libavfilter.a"
          - "-Wl,-force_load,$(SRCROOT)/Vendor/ffmpeg-ios/lib/libswscale.a"
          - "-Wl,-force_load,$(SRCROOT)/Vendor/ffmpeg-ios/lib/libswresample.a"
          - "-Wl,-force_load,$(SRCROOT)/Vendor/ffmpeg-ios/lib/libavutil.a"
          - "-Wl,-force_load,$(SRCROOT)/Vendor/ffmpeg-ios/lib/libx265.a"
        PRODUCT_NAME: RIFE60GhostGuard
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 195
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SWIFT_VERSION: 5.10
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        CODE_SIGN_ENTITLEMENTS: RIFE60GhostGuard.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: RIFE 60 Ghost Guard
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Select videos and images to process locally on this device.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Automatically save finished 4K videos to Photos.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIBackgroundModes:
          - audio
          - fetch
    scheme:
      testTargets: []


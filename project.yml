name: RIFE60GhostGuard

options:
  bundleIdPrefix: com.za
  deploymentTarget:
    iOS: "16.0"

packages:
  RifeMetal:
    path: Vendor/rife-metal

targets:
  RIFE60GhostGuard:
    type: application
    platform: iOS
    sources:
      - path: .
        includes:
          - "*.swift"
      - path: Assets.xcassets
    dependencies:
      - package: RifeMetal
        product: RifeMetal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.za.rife60ghostguard
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/RIFE60GhostGuard-Bridging-Header.h"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/sd-cpp/include"
          - "$(SRCROOT)/Vendor/sd-cpp/ggml/include"
          - "$(SRCROOT)/Vendor/sd-cpp/ggml/src"
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/sd-cpp/lib"
        OTHER_LDFLAGS:
          - "-Wl,-force_load,$(SRCROOT)/Vendor/sd-cpp/lib/libstable-diffusion.a"
          - "$(SRCROOT)/Vendor/sd-cpp/lib/libggml.a"
          - "$(SRCROOT)/Vendor/sd-cpp/lib/libggml-base.a"
          - "$(SRCROOT)/Vendor/sd-cpp/lib/libggml-metal.a"
          - "$(SRCROOT)/Vendor/sd-cpp/lib/libggml-cpu.a"
          - "$(SRCROOT)/Vendor/sd-cpp/lib/libonig.a"
          - "$(SRCROOT)/Vendor/sd-cpp/lib/libsd-utf8proc.a"
          - "-framework"
          - "Metal"
          - "-framework"
          - "Foundation"
          - "-framework"
          - "Accelerate"
          - "-lc++"
        PRODUCT_NAME: RIFE60GhostGuard
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 172
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        INFOPLIST_KEY_CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SWIFT_VERSION: 5.10
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: RIFE 60 Ghost Guard
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Select videos and images to process locally on this device.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Automatically save finished 4K videos to Photos.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIBackgroundModes:
          - audio
    scheme:
      testTargets: []


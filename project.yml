name: RIFE60GhostGuard

options:
  bundleIdPrefix: com.za
  deploymentTarget:
    iOS: "16.0"

packages:
  RifeMetal:
    path: Vendor/rife-metal

targets:
  RIFE60GhostGuard:
    type: application
    platform: iOS

    sources:
      - path: .
        includes:
          - "*.swift"
      - path: Assets.xcassets
      - path: Models/RealCUGAN2xNoise3_1080p.mlpackage
        buildPhase: resources

    dependencies:
      - package: RifeMetal
        product: RifeMetal

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.za.rife60ghostguard
        PRODUCT_NAME: RIFE60GhostGuard
        SWIFT_VERSION: 5.10
        IPHONEOS_DEPLOYMENT_TARGET: 16.0
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: RIFE 60 Ghost Guard
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Select videos to process locally on this device.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Automatically save finished 4K videos to Photos.
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES

    scheme:
      testTargets: []

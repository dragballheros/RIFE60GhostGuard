name: Wan VACE 14B checkpoint header audit

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Hugging Face commit SHA or revision to audit
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit official 14B safetensors headers without downloading tensor weights
        run: |
          python Scripts/audit_wan_vace_checkpoint_headers.py \
            --repo Wan-AI/Wan2.1-VACE-14B \
            --revision "${{ inputs.revision }}" \
            --output artifacts/wan-vace-14b-header-audit.json
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: wan-vace-14b-header-audit
          path: artifacts/wan-vace-14b-header-audit.json
          if-no-files-found: error
          retention-days: 30

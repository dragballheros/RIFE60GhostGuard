name: Unblock Prompt Selection Fix Build

# One-time recovery helper: the pre-fix Build 603 is occupying the serialized
# main-branch build slot. This cancels that stale run so the prompt-fix build
# can start. It does not alter application source.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/unblock-prompt-fix-build.yml

permissions:
  actions: write

jobs:
  unblock:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel pre-fix build holding the main concurrency slot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run cancel 38172730741 --repo "$GITHUB_REPOSITORY" || true

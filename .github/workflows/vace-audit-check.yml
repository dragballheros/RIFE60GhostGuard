name: VACE Checkpoint Audit Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "Scripts/inspect_vace_checkpoint.py"
      - "Scripts/test_inspect_vace_checkpoint.py"
      - ".github/workflows/vace-audit-check.yml"
      - "Docs/Wan21VACE-iOS-Feasibility.md"
  push:
    branches: [research/wan21-vace-ios-feasibility]
    paths:
      - "Scripts/inspect_vace_checkpoint.py"
      - "Scripts/test_inspect_vace_checkpoint.py"
      - ".github/workflows/vace-audit-check.yml"
      - "Docs/Wan21VACE-iOS-Feasibility.md"

permissions:
  contents: read

jobs:
  checkpoint-auditor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile audit scripts
        run: python -m py_compile Scripts/inspect_vace_checkpoint.py Scripts/test_inspect_vace_checkpoint.py
      - name: Test safe artifact inspection
        run: python -m unittest Scripts/test_inspect_vace_checkpoint.py -v

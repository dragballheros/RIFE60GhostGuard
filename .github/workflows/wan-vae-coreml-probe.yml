name: Wan VAE Core ML Export Probe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "Scripts/probe_wan_vae_coreml.py"
      - "Scripts/probe_wan_vae_decoder_coreml.py"
      - "Scripts/probe_vace_attention_coreml.py"
      - "Scripts/probe_wan_vae_temporal_cache.py"
      - ".github/workflows/wan-vae-coreml-probe.yml"
      - "Docs/Wan21VACE-iOS-Feasibility.md"
      - "Docs/WanVAE-CoreML-Probe-Results.md"

permissions:
  contents: read

jobs:
  vae-export:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Core ML conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1' 'coremltools==9.0' 'numpy==1.26.4' einops easydict
      - name: Fetch pinned official Wan implementation
        run: |
          git clone https://github.com/Wan-Video/Wan2.1.git Vendor/Wan2.1
          git -C Vendor/Wan2.1 checkout 9737cba9c1c3c4d04b33fcad41c111989865d315
      - name: Download official VACE VAE weights only
        run: |
          set -euo pipefail
          mkdir -p /tmp/vace-checkpoint
          curl --fail --location --retry 3 'https://huggingface.co/Wan-AI/Wan2.1-VACE-1.3B/resolve/main/Wan2.1_VAE.pth?download=true' --output /tmp/vace-checkpoint/Wan2.1_VAE.pth
          test -s /tmp/vace-checkpoint/Wan2.1_VAE.pth
      - name: Validate official temporal-cache equivalence
        run: >-
          python Scripts/probe_wan_vae_temporal_cache.py
          --wan-repo Vendor/Wan2.1
          --checkpoint /tmp/vace-checkpoint/Wan2.1_VAE.pth
          --output /tmp/WanVAE-TemporalCache.validation.json
      - name: Attempt fixed-shape temporal VAE encoder conversion
        run: |
          python Scripts/probe_wan_vae_coreml.py \
            --wan-repo Vendor/Wan2.1 \
            --checkpoint /tmp/vace-checkpoint/Wan2.1_VAE.pth \
            --output /tmp/WanVAEEncoder-5x64.mlpackage \
            --frames 5 --height 64 --width 64
      - name: Attempt fixed-shape VAE decoder conversion
        run: |
          python Scripts/probe_wan_vae_decoder_coreml.py \
            --wan-repo Vendor/Wan2.1 \
            --checkpoint /tmp/vace-checkpoint/Wan2.1_VAE.pth \
            --output /tmp/WanVAEDecoder-5x8.mlpackage \
            --latent-frames 5 --latent-height 8 --latent-width 8
      - name: Probe fixed-shape SDPA attention replacement
        run: >-
          python Scripts/probe_vace_attention_coreml.py
          --output /tmp/VACEAttention-SDPA-32x512.mlpackage
          --query-tokens 32 --key-tokens 512 --heads 40 --head-dim 128
      - name: Upload conversion diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wan-vae-coreml-probe-diagnostics
          path: |
            /tmp/WanVAEEncoder-5x64.validation.json
            /tmp/WanVAEDecoder-5x8.validation.json
            /tmp/VACEAttention-SDPA-32x512.validation.json
            /tmp/WanVAE-TemporalCache.validation.json
          if-no-files-found: warn
          retention-days: 14

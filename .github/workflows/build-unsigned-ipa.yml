name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare permanent Sharpie model
        run: |
          set -euo pipefail
          test -f SharpieModel.mlpackage.zip
          rm -rf /tmp/sharpie-unpack Models/AnimeSharpieOutlineSubtle.mlpackage
          mkdir -p /tmp/sharpie-unpack Models
          unzip -q SharpieModel.mlpackage.zip -d /tmp/sharpie-unpack
          SHARPIE_PACKAGE=$(find /tmp/sharpie-unpack -type f -name Manifest.json -print -quit | xargs dirname)
          test -n "$SHARPIE_PACKAGE"
          cp -R "$SHARPIE_PACKAGE" Models/AnimeSharpieOutlineSubtle.mlpackage
          test -f Models/AnimeSharpieOutlineSubtle.mlpackage/Manifest.json
          SHARPIE_WEIGHT=$(find Models/AnimeSharpieOutlineSubtle.mlpackage -type f -name 'weight.bin' -print -quit)
          test -n "$SHARPIE_WEIGHT"
          test -s "$SHARPIE_WEIGHT"

      - name: Restore stable Real-CUGAN model cache
        uses: actions/cache@v4
        with:
          path: |
            Models/RealCUGAN2xNoise3_Tile512.mlpackage
            Models/RealCUGAN2xNoise3_Tile704x608.mlpackage
            CompiledModels/RealCUGAN2xNoise3_Tile512.mlmodelc
            CompiledModels/RealCUGAN2xNoise3_Tile704x608.mlmodelc
          key: realcugan-noise3-fp16-512-and-704x608-v1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare stable Real-CUGAN source models if needed
        run: |
          set -euo pipefail
          NEED512=0
          NEED704=0
          test -f Models/RealCUGAN2xNoise3_Tile512.mlpackage/Manifest.json || NEED512=1
          test -f Models/RealCUGAN2xNoise3_Tile704x608.mlpackage/Manifest.json || NEED704=1
          if [ "$NEED512" = 1 ] || [ "$NEED704" = 1 ]; then
            python -m pip install --upgrade pip
            python -m pip install 'torch==2.5.0' 'coremltools==8.3' 'numpy==1.26.4'
            rm -rf /tmp/video_upscale /tmp/realcugan-weights
            git clone --depth 1 https://github.com/apleynes/video_upscale_mac_silicon.git /tmp/video_upscale
            mkdir -p /tmp/realcugan-weights Models
            curl -L --fail --retry 3 -o /tmp/updated_weights.zip https://github.com/bilibili/ailab/releases/download/Real-CUGAN/updated_weights.zip
            unzip -q /tmp/updated_weights.zip -d /tmp/realcugan-weights
            WEIGHT=$(find /tmp/realcugan-weights -name 'up2x-latest-denoise3x.pth' -print -quit)
            test -n "$WEIGHT"
            if [ "$NEED512" = 1 ]; then
              REALCUGAN_DIR=/tmp/video_upscale/realcugan/Real-CUGAN REALCUGAN_WEIGHT="$WEIGHT" REALCUGAN_TILE_WIDTH=512 REALCUGAN_TILE_HEIGHT=512 REALCUGAN_OUT=Models/RealCUGAN2xNoise3_Tile512.mlpackage python Scripts/export_realcugan_1080p.py
            fi
            if [ "$NEED704" = 1 ]; then
              REALCUGAN_DIR=/tmp/video_upscale/realcugan/Real-CUGAN REALCUGAN_WEIGHT="$WEIGHT" REALCUGAN_TILE_WIDTH=704 REALCUGAN_TILE_HEIGHT=608 REALCUGAN_OUT=Models/RealCUGAN2xNoise3_Tile704x608.mlpackage python Scripts/export_realcugan_1080p.py
            fi
          fi
          test -f Models/RealCUGAN2xNoise3_Tile512.mlpackage/Manifest.json
          test -f Models/RealCUGAN2xNoise3_Tile704x608.mlpackage/Manifest.json

      - name: Compile stable Real-CUGAN models for iOS if needed
        run: |
          set -euo pipefail
          mkdir -p CompiledModels
          if [ ! -d CompiledModels/RealCUGAN2xNoise3_Tile512.mlmodelc ]; then xcrun coremlcompiler compile Models/RealCUGAN2xNoise3_Tile512.mlpackage CompiledModels; fi
          if [ ! -d CompiledModels/RealCUGAN2xNoise3_Tile704x608.mlmodelc ]; then xcrun coremlcompiler compile Models/RealCUGAN2xNoise3_Tile704x608.mlpackage CompiledModels; fi
          test -d CompiledModels/RealCUGAN2xNoise3_Tile512.mlmodelc
          test -d CompiledModels/RealCUGAN2xNoise3_Tile704x608.mlmodelc

      - name: Generate professional app icon
        run: |
          rm -rf Assets.xcassets
          swift Scripts/generate_app_icon.swift
          test -f Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Vendor and patch RifeMetal
        run: |
          rm -rf Vendor/rife-metal
          mkdir -p Vendor
          git clone --depth 1 https://github.com/cinemore/rife-metal.git Vendor/rife-metal
          python3 - <<'PY'
          from pathlib import Path
          import re
          pkg = Path('Vendor/rife-metal/Package.swift')
          text = pkg.read_text()
          text2, n1 = re.subn(r'\.target\(\s*name:\s*"RifeMetalCore",\s*exclude:\s*\["Shaders"\],\s*plugins:\s*\[\.plugin\(name:\s*"CompileMetalShaders"\)\]\s*\),', '.target(\n            name: "RifeMetalCore"\n        ),', text, flags=re.S)
          text3, n2 = re.subn(r'\s*\.plugin\(\s*name:\s*"CompileMetalShaders",\s*capability:\s*\.buildTool\(\)\s*\),', '', text2, flags=re.S)
          if n1 != 1 or n2 != 1: raise SystemExit(f'Unexpected RifeMetal manifest layout: {n1}, {n2}')
          pkg.write_text(text3)
          PY

      - name: Stabilize Real-CUGAN while keeping overhead reductions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('RealCUGANPass.swift')
          s = p.read_text()
          old = 'private let fast1080Profile = TileProfile(width: 1024, height: 608, overlap: 32, modelName: "RealCUGAN2xNoise3_Tile1024x608")'
          new = 'private let fast1080Profile = TileProfile(width: 704, height: 608, overlap: 32, modelName: "RealCUGAN2xNoise3_Tile704x608")'
          if old not in s:
              raise SystemExit('Expected 1024x608 CUGAN profile not found')
          s = s.replace(old, new, 1)
          s = s.replace('// 1920x1080 frame needs 2x2 = 4 predictions instead of 3x2 = 6.', '// 1920x1080 uses the proven 3x2 = 6 prediction profile to avoid peak-memory crashes.')
          p.write_text(s)
          PY

      - name: Apply automatic cooled Performance Mode
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new, count=None):
              p = Path(path)
              s = p.read_text()
              found = s.count(old)
              if found == 0:
                  raise SystemExit(f'Performance patch target missing in {path}: {old[:80]!r}')
              if count is not None and found != count:
                  raise SystemExit(f'Unexpected Performance patch count in {path}: expected {count}, found {found}')
              s = s.replace(old, new)
              p.write_text(s)

          # RIFE: keep HQ/model/timesteps unchanged. At Nominal/Fair poll the
          # hardware writer more aggressively, yield less, and retain buffers
          # longer so the Metal stream is fed with less CPU-side interruption.
          replace_required(
              'RIFEVideoProcessor.swift',
              'try await Task.sleep(nanoseconds: 2_000_000)',
              'try await Task.sleep(nanoseconds: automaticPerformanceModeEnabled() ? 250_000 : 2_000_000)',
              1
          )
          replace_required(
              'RIFEVideoProcessor.swift',
              'await Task.yield()',
              'if !automaticPerformanceModeEnabled() { await Task.yield() }',
              1
          )
          replace_required(
              'RIFEVideoProcessor.swift',
              'if sourceFrames % 12 == 0 {\n                CVPixelBufferPoolFlush(pool, .excessBuffers)\n            }',
              'if sourceFrames % (automaticPerformanceModeEnabled() ? 48 : 12) == 0 {\n                CVPixelBufferPoolFlush(pool, .excessBuffers)\n            }',
              1
          )

          # CUGAN keeps Core ML .all so iOS may use the Neural Engine instead of
          # forcing a growing GPU allocation. Wide tiles require 1.7 GB of live
          # process headroom; otherwise the identical 512 model is selected.
          replace_required(
              'RealCUGANPass.swift',
              'let profile = (width >= 1600 || height >= 1600) ? fast1080Profile : fallbackProfile',
              'let memoryAtStart = currentRenderPerformanceSnapshot()\n        let profile = ((width >= 1600 || height >= 1600) && memoryAtStart.allowsWideCUGANTiles) ? fast1080Profile : fallbackProfile',
              1
          )
          replace_required(
              'RealCUGANPass.swift',
              'try await Task.sleep(nanoseconds: 1_000_000)',
              'try await Task.sleep(nanoseconds: automaticPerformanceModeEnabled() ? 250_000 : 1_000_000)',
              1
          )
          replace_required(
              'RealCUGANPass.swift',
              '            frames += 1\n\n            if frames == 1 || frames % 20 == 0 {',
              '            frames += 1\n            let memory = currentRenderPerformanceSnapshot()\n            if memory.tier != .performance {\n                if let tileInputPool { CVPixelBufferPoolFlush(tileInputPool, .excessBuffers) }\n                if let stitchedFramePool { CVPixelBufferPoolFlush(stitchedFramePool, .excessBuffers) }\n                ciContext.clearCaches()\n            }\n            try await adaptiveFrameBoundaryPacing(memory)\n\n            if frames == 1 || frames % 20 == 0 {',
              1
          )
          replace_required(
              'RealCUGANPass.swift',
              '                await Task.yield()',
              '                if !automaticPerformanceModeEnabled() { await Task.yield() }',
              1
          )
          replace_required(
              'RealCUGANPass.swift',
              'if frames % 12 == 0 {',
              'if frames % 4 == 0 {',
              1
          )

          # Sharpie Core ML: use GPU-preferred compute while cooled. The model,
          # blend strength, line width and pixel math are unchanged.
          replace_required(
              'OutlineEnhancer.swift',
              'configuration.computeUnits = .all',
              'configuration.computeUnits = automaticPerformanceModeEnabled() ? .cpuAndGPU : .all',
              1
          )

          # Final visual pass: reduce writer polling/yield overhead in Performance
          # Mode and sample thermal state only after each completed frame.
          replace_required(
              'FinalOutlinePass.swift',
              'while !input.isReadyForMoreMediaData { try Task.checkCancellation(); try await Task.sleep(nanoseconds: 1_000_000) }',
              'while !input.isReadyForMoreMediaData { try Task.checkCancellation(); try await Task.sleep(nanoseconds: automaticPerformanceModeEnabled() ? 250_000 : 1_000_000) }',
              1
          )
          replace_required(
              'FinalOutlinePass.swift',
              '            frames += 1\n\n            if frames == 1 || frames % 10 == 0 {',
              '            frames += 1\n            try await thermalFrameBoundaryPacing()\n\n            if frames == 1 || frames % 10 == 0 {',
              1
          )
          replace_required(
              'FinalOutlinePass.swift',
              '                await Task.yield()',
              '                if !automaticPerformanceModeEnabled() { await Task.yield() }',
              1
          )
          PY

      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project RIFE60GhostGuard.xcodeproj -scheme RIFE60GhostGuard
      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -project RIFE60GhostGuard.xcodeproj -scheme RIFE60GhostGuard -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build | tee xcodebuild.log

      - name: Create verified IPA
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RIFE60GhostGuard.app Payload/
          cp -R Models/AnimeSharpieOutlineSubtle.mlpackage Payload/RIFE60GhostGuard.app/
          cp -R CompiledModels/RealCUGAN2xNoise3_Tile512.mlmodelc Payload/RIFE60GhostGuard.app/
          cp -R CompiledModels/RealCUGAN2xNoise3_Tile704x608.mlmodelc Payload/RIFE60GhostGuard.app/
          test -f Payload/RIFE60GhostGuard.app/AnimeSharpieOutlineSubtle.mlpackage/Manifest.json
          SHARPIE_WEIGHT=$(find Payload/RIFE60GhostGuard.app/AnimeSharpieOutlineSubtle.mlpackage -type f -name 'weight.bin' -print -quit)
          test -n "$SHARPIE_WEIGHT"
          test -s "$SHARPIE_WEIGHT"
          test -d Payload/RIFE60GhostGuard.app/RealCUGAN2xNoise3_Tile512.mlmodelc
          test -d Payload/RIFE60GhostGuard.app/RealCUGAN2xNoise3_Tile704x608.mlmodelc
          zip -qry RIFE60GhostGuard-verified-unsigned.ipa Payload
          unzip -t RIFE60GhostGuard-verified-unsigned.ipa >/dev/null

      - name: Upload verified IPA
        uses: actions/upload-artifact@v4
        with:
          name: RIFE60GhostGuard-verified-unsigned-ipa
          path: RIFE60GhostGuard-verified-unsigned.ipa
          retention-days: 30
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
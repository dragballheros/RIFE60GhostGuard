name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Restore Sharpie outline model cache
        id: outline-cache
        uses: actions/cache@v4
        with:
          path: Models/AnimeSharpieOutlineSubtle.mlpackage
          key: anime-sharpie-outline-subtle-final-thin-v1

      - name: Recover Sharpie outline model if needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f Models/AnimeSharpieOutlineSubtle.mlpackage/Manifest.json ]; then
            echo "Outline cache empty; recovering exact final-thin model from known-good Build #49 artifact"
            rm -rf /tmp/outline-artifact /tmp/outline-ipa /tmp/outline-artifact.zip
            mkdir -p /tmp/outline-artifact /tmp/outline-ipa Models
            gh api \
              -H 'Accept: application/vnd.github+json' \
              /repos/${{ github.repository }}/actions/artifacts/10943611458/zip \
              > /tmp/outline-artifact.zip
            unzip -q /tmp/outline-artifact.zip -d /tmp/outline-artifact
            IPA=$(find /tmp/outline-artifact -type f -name '*.ipa' -print -quit)
            test -n "$IPA"
            unzip -q "$IPA" 'Payload/RIFE60GhostGuard.app/AnimeSharpieOutlineSubtle.mlpackage/*' -d /tmp/outline-ipa
            cp -R /tmp/outline-ipa/Payload/RIFE60GhostGuard.app/AnimeSharpieOutlineSubtle.mlpackage Models/
          fi
          test -f Models/AnimeSharpieOutlineSubtle.mlpackage/Manifest.json
          test -f Models/AnimeSharpieOutlineSubtle.mlpackage/Data/com.apple.CoreML/weights/weight.bin
          echo "Sharpie model weights: $(stat -f%z Models/AnimeSharpieOutlineSubtle.mlpackage/Data/com.apple.CoreML/weights/weight.bin) bytes"

      - name: Restore Real-CUGAN model cache
        id: cugan-cache
        uses: actions/cache@v4
        with:
          path: |
            Models/RealCUGAN2xNoise3_1080p.mlpackage
            CompiledModels/RealCUGAN2xNoise3_1080p.mlmodelc
          key: realcugan-2x-noise3-1080p-fp16-compiled-v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Real-CUGAN source model if needed
        run: |
          if [ ! -f Models/RealCUGAN2xNoise3_1080p.mlpackage/Manifest.json ]; then
            python -m pip install --upgrade pip
            python -m pip install 'torch==2.5.0' 'coremltools==8.3' 'numpy==1.26.4'
            rm -rf /tmp/video_upscale /tmp/realcugan-weights
            git clone --depth 1 https://github.com/apleynes/video_upscale_mac_silicon.git /tmp/video_upscale
            mkdir -p /tmp/realcugan-weights Models
            curl -L --fail --retry 3 -o /tmp/updated_weights.zip \
              https://github.com/bilibili/ailab/releases/download/Real-CUGAN/updated_weights.zip
            unzip -q /tmp/updated_weights.zip -d /tmp/realcugan-weights
            WEIGHT=$(find /tmp/realcugan-weights -name 'up2x-latest-denoise3x.pth' -print -quit)
            test -n "$WEIGHT"
            REALCUGAN_DIR=/tmp/video_upscale/realcugan/Real-CUGAN \
            REALCUGAN_WEIGHT="$WEIGHT" \
            REALCUGAN_OUT=Models/RealCUGAN2xNoise3_1080p.mlpackage \
              python Scripts/export_realcugan_1080p.py
          fi
          test -f Models/RealCUGAN2xNoise3_1080p.mlpackage/Manifest.json

      - name: Compile Real-CUGAN for iOS if needed
        run: |
          if [ ! -d CompiledModels/RealCUGAN2xNoise3_1080p.mlmodelc ]; then
            rm -rf CompiledModels
            mkdir -p CompiledModels
            xcrun coremlcompiler compile Models/RealCUGAN2xNoise3_1080p.mlpackage CompiledModels
          fi
          test -d CompiledModels/RealCUGAN2xNoise3_1080p.mlmodelc

      - name: Generate professional app icon
        run: |
          rm -rf Assets.xcassets
          swift Scripts/generate_app_icon.swift
          test -f Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          test -f Assets.xcassets/AppIcon.appiconset/Contents.json

      - name: Vendor and patch RifeMetal
        run: |
          rm -rf Vendor/rife-metal
          mkdir -p Vendor
          git clone --depth 1 https://github.com/cinemore/rife-metal.git Vendor/rife-metal
          python3 - <<'PY'
          from pathlib import Path
          import re
          pkg = Path('Vendor/rife-metal/Package.swift')
          text = pkg.read_text()
          text2, n1 = re.subn(r'\.target\(\s*name:\s*"RifeMetalCore",\s*exclude:\s*\["Shaders"\],\s*plugins:\s*\[\.plugin\(name:\s*"CompileMetalShaders"\)\]\s*\),', '.target(\n            name: "RifeMetalCore"\n        ),', text, flags=re.S)
          text3, n2 = re.subn(r'\s*\.plugin\(\s*name:\s*"CompileMetalShaders",\s*capability:\s*\.buildTool\(\)\s*\),', '', text2, flags=re.S)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Unexpected RifeMetal manifest layout: target patches={n1}, plugin patches={n2}')
          pkg.write_text(text3)
          warp = Path('Vendor/rife-metal/Sources/RifeMetalCore/BackwardWarpKernel.swift')
          if 'device.makeDefaultLibrary(bundle: Bundle.module)' not in warp.read_text():
              raise SystemExit('Expected Bundle.module shader loader not found')
          PY

      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project RIFE60GhostGuard.xcodeproj -scheme RIFE60GhostGuard
      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -project RIFE60GhostGuard.xcodeproj -scheme RIFE60GhostGuard \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' build | tee xcodebuild.log

      - name: Create IPA with AI models
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RIFE60GhostGuard.app Payload/
          cp -R Models/AnimeSharpieOutlineSubtle.mlpackage Payload/RIFE60GhostGuard.app/
          cp -R CompiledModels/RealCUGAN2xNoise3_1080p.mlmodelc Payload/RIFE60GhostGuard.app/
          test -f Payload/RIFE60GhostGuard.app/AnimeSharpieOutlineSubtle.mlpackage/Manifest.json
          test -f Payload/RIFE60GhostGuard.app/AnimeSharpieOutlineSubtle.mlpackage/Data/com.apple.CoreML/weights/weight.bin
          test -d Payload/RIFE60GhostGuard.app/RealCUGAN2xNoise3_1080p.mlmodelc
          test "$(stat -f%z Payload/RIFE60GhostGuard.app/AnimeSharpieOutlineSubtle.mlpackage/Data/com.apple.CoreML/weights/weight.bin)" = "228928"
          zip -qry RIFE60GhostGuard-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RIFE60GhostGuard-unsigned-ipa
          path: RIFE60GhostGuard-unsigned.ipa
          retention-days: 30
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

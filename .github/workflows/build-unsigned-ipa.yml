name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Restore Real-CUGAN Core ML cache
        id: cugan-cache
        uses: actions/cache@v4
        with:
          path: Models/RealCUGAN2xNoise3_1080p.mlpackage
          key: realcugan-2x-noise3-1080p-fp16-v3

      - name: Set up Python for Real-CUGAN conversion
        if: steps.cugan-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Convert Real-CUGAN Anime 2x Noise 3 to Core ML
        if: steps.cugan-cache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'torch==2.5.1' 'coremltools==8.3' numpy
          rm -rf /tmp/video_upscale /tmp/realcugan-weights
          git clone --depth 1 https://github.com/apleynes/video_upscale_mac_silicon.git /tmp/video_upscale
          mkdir -p /tmp/realcugan-weights Models
          curl -L --fail --retry 3 -o /tmp/updated_weights.zip \
            https://github.com/bilibili/ailab/releases/download/Real-CUGAN/updated_weights.zip
          unzip -q /tmp/updated_weights.zip -d /tmp/realcugan-weights
          WEIGHT=$(find /tmp/realcugan-weights -name 'up2x-latest-denoise3x.pth' -print -quit)
          test -n "$WEIGHT"
          REALCUGAN_DIR=/tmp/video_upscale/realcugan/Real-CUGAN \
          REALCUGAN_WEIGHT="$WEIGHT" \
          REALCUGAN_OUT=Models/RealCUGAN2xNoise3_1080p.mlpackage \
            python Scripts/export_realcugan_1080p.py
          test -f Models/RealCUGAN2xNoise3_1080p.mlpackage/Manifest.json

      - name: Generate professional app icon
        run: |
          rm -rf Assets.xcassets
          swift Scripts/generate_app_icon.swift
          test -f Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          test -f Assets.xcassets/AppIcon.appiconset/Contents.json

      - name: Vendor and patch RifeMetal
        run: |
          rm -rf Vendor/rife-metal
          mkdir -p Vendor
          git clone --depth 1 https://github.com/cinemore/rife-metal.git Vendor/rife-metal
          python3 - <<'PY'
          from pathlib import Path
          import re
          pkg = Path('Vendor/rife-metal/Package.swift')
          text = pkg.read_text()
          text2, n1 = re.subn(r'\.target\(\s*name:\s*"RifeMetalCore",\s*exclude:\s*\["Shaders"\],\s*plugins:\s*\[\.plugin\(name:\s*"CompileMetalShaders"\)\]\s*\),', '.target(\n            name: "RifeMetalCore"\n        ),', text, flags=re.S)
          text3, n2 = re.subn(r'\s*\.plugin\(\s*name:\s*"CompileMetalShaders",\s*capability:\s*\.buildTool\(\)\s*\),', '', text2, flags=re.S)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Unexpected RifeMetal manifest layout: target patches={n1}, plugin patches={n2}')
          pkg.write_text(text3)
          warp = Path('Vendor/rife-metal/Sources/RifeMetalCore/BackwardWarpKernel.swift')
          if 'device.makeDefaultLibrary(bundle: Bundle.module)' not in warp.read_text():
              raise SystemExit('Expected Bundle.module shader loader not found')
          PY

      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project RIFE60GhostGuard.xcodeproj -scheme RIFE60GhostGuard
      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -project RIFE60GhostGuard.xcodeproj -scheme RIFE60GhostGuard \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' build | tee xcodebuild.log
      - name: Create IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RIFE60GhostGuard.app Payload/
          zip -qry RIFE60GhostGuard-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RIFE60GhostGuard-unsigned-ipa
          path: RIFE60GhostGuard-unsigned.ipa
          retention-days: 30
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

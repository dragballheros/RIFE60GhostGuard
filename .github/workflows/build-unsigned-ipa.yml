name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Vendor and patch RifeMetal
        run: |
          rm -rf Vendor/rife-metal
          mkdir -p Vendor
          git clone --depth 1 https://github.com/cinemore/rife-metal.git Vendor/rife-metal
          python3 - <<'PY'
          from pathlib import Path

          pkg = Path('Vendor/rife-metal/Package.swift')
          text = pkg.read_text()
          old = '''        .target(
              name: "RifeMetalCore",
              exclude: ["Shaders"],
              plugins: [.plugin(name: "CompileMetalShaders")]
          ),
          .plugin(
              name: "CompileMetalShaders",
              capability: .buildTool()
          ),'''
          new = '''        .target(
              name: "RifeMetalCore"
          ),'''
          if old not in text:
              raise SystemExit('RifeMetal Package.swift layout changed; patch target not found')
          pkg.write_text(text.replace(old, new))

          warp = Path('Vendor/rife-metal/Sources/RifeMetalCore/BackwardWarpKernel.swift')
          w = warp.read_text()
          needle = 'device.makeDefaultLibrary(bundle: Bundle.module)'
          if needle not in w:
              raise SystemExit('RifeMetal shader loader layout changed; patch target not found')
          warp.write_text(w.replace(needle, 'device.makeDefaultLibrary()'))
          PY

          echo '--- patched Package.swift ---'
          cat Vendor/rife-metal/Package.swift
          echo '--- makeDefaultLibrary references ---'
          grep -n 'makeDefaultLibrary' Vendor/rife-metal/Sources/RifeMetalCore/BackwardWarpKernel.swift

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project RIFE60GhostGuard.xcodeproj \
            -scheme RIFE60GhostGuard

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project RIFE60GhostGuard.xcodeproj \
            -scheme RIFE60GhostGuard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee xcodebuild.log

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R \
            build/Build/Products/Release-iphoneos/RIFE60GhostGuard.app \
            Payload/
          zip -qry RIFE60GhostGuard-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RIFE60GhostGuard-unsigned-ipa
          path: RIFE60GhostGuard-unsigned.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

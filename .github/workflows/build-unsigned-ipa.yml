name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare permanent Sharpie model
        run: |
          set -euo pipefail
          test -f SharpieModel.mlpackage.zip
          rm -rf /tmp/sharpie-unpack Models/AnimeSharpieOutlineSubtle.mlpackage
          mkdir -p /tmp/sharpie-unpack Models
          unzip -q SharpieModel.mlpackage.zip -d /tmp/sharpie-unpack
          SHARPIE_PACKAGE=$(find /tmp/sharpie-unpack -type f -name Manifest.json -print -quit | xargs dirname)
          test -n "$SHARPIE_PACKAGE"
          cp -R "$SHARPIE_PACKAGE" Models/AnimeSharpieOutlineSubtle.mlpackage
          test -f Models/AnimeSharpieOutlineSubtle.mlpackage/Manifest.json
          SHARPIE_WEIGHT=$(find Models/AnimeSharpieOutlineSubtle.mlpackage -type f -name 'weight.bin' -print -quit)
          test -n "$SHARPIE_WEIGHT"
          test -s "$SHARPIE_WEIGHT"
          echo "Sharpie source package verified: $SHARPIE_WEIGHT"

      - name: Restore Real-CUGAN model cache
        uses: actions/cache@v4
        with:
          path: |
            Models/RealCUGAN2xNoise3_Tile512.mlpackage
            Models/RealCUGAN2xNoise3_Tile704x608.mlpackage
            CompiledModels/RealCUGAN2xNoise3_Tile512.mlmodelc
            CompiledModels/RealCUGAN2xNoise3_Tile704x608.mlmodelc
          key: realcugan-noise3-fp16-512-and-704x608-v1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare Real-CUGAN source models if needed
        run: |
          set -euo pipefail
          NEED512=0
          NEEDFAST=0
          test -f Models/RealCUGAN2xNoise3_Tile512.mlpackage/Manifest.json || NEED512=1
          test -f Models/RealCUGAN2xNoise3_Tile704x608.mlpackage/Manifest.json || NEEDFAST=1
          if [ "$NEED512" = 1 ] || [ "$NEEDFAST" = 1 ]; then
            python -m pip install --upgrade pip
            python -m pip install 'torch==2.5.0' 'coremltools==8.3' 'numpy==1.26.4'
            rm -rf /tmp/video_upscale /tmp/realcugan-weights
            git clone --depth 1 https://github.com/apleynes/video_upscale_mac_silicon.git /tmp/video_upscale
            mkdir -p /tmp/realcugan-weights Models
            curl -L --fail --retry 3 -o /tmp/updated_weights.zip https://github.com/bilibili/ailab/releases/download/Real-CUGAN/updated_weights.zip
            unzip -q /tmp/updated_weights.zip -d /tmp/realcugan-weights
            WEIGHT=$(find /tmp/realcugan-weights -name 'up2x-latest-denoise3x.pth' -print -quit)
            test -n "$WEIGHT"
            if [ "$NEED512" = 1 ]; then
              REALCUGAN_DIR=/tmp/video_upscale/realcugan/Real-CUGAN REALCUGAN_WEIGHT="$WEIGHT" REALCUGAN_TILE_WIDTH=512 REALCUGAN_TILE_HEIGHT=512 REALCUGAN_OUT=Models/RealCUGAN2xNoise3_Tile512.mlpackage python Scripts/export_realcugan_1080p.py
            fi
            if [ "$NEEDFAST" = 1 ]; then
              REALCUGAN_DIR=/tmp/video_upscale/realcugan/Real-CUGAN REALCUGAN_WEIGHT="$WEIGHT" REALCUGAN_TILE_WIDTH=704 REALCUGAN_TILE_HEIGHT=608 REALCUGAN_OUT=Models/RealCUGAN2xNoise3_Tile704x608.mlpackage python Scripts/export_realcugan_1080p.py
            fi
          fi
          test -f Models/RealCUGAN2xNoise3_Tile512.mlpackage/Manifest.json
          test -f Models/RealCUGAN2xNoise3_Tile704x608.mlpackage/Manifest.json

      - name: Compile Real-CUGAN models for iOS if needed
        run: |
          set -euo pipefail
          mkdir -p CompiledModels
          if [ ! -d CompiledModels/RealCUGAN2xNoise3_Tile512.mlmodelc ]; then xcrun coremlcompiler compile Models/RealCUGAN2xNoise3_Tile512.mlpackage CompiledModels; fi
          if [ ! -d CompiledModels/RealCUGAN2xNoise3_Tile704x608.mlmodelc ]; then xcrun coremlcompiler compile Models/RealCUGAN2xNoise3_Tile704x608.mlpackage CompiledModels; fi
          test -d CompiledModels/RealCUGAN2xNoise3_Tile512.mlmodelc
          test -d CompiledModels/RealCUGAN2xNoise3_Tile704x608.mlmodelc

      - name: Generate professional app icon
        run: |
          rm -rf Assets.xcassets
          swift Scripts/generate_app_icon.swift
          test -f Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          test -f Assets.xcassets/AppIcon.appiconset/Contents.json

      - name: Vendor and patch RifeMetal
        run: |
          rm -rf Vendor/rife-metal
          mkdir -p Vendor
          git clone --depth 1 https://github.com/cinemore/rife-metal.git Vendor/rife-metal
          python3 - <<'PY'
          from pathlib import Path
          import re
          pkg = Path('Vendor/rife-metal/Package.swift')
          text = pkg.read_text()
          text2, n1 = re.subn(r'\.target\(\s*name:\s*"RifeMetalCore",\s*exclude:\s*\["Shaders"\],\s*plugins:\s*\[\.plugin\(name:\s*"CompileMetalShaders"\)\]\s*\),', '.target(\n            name: "RifeMetalCore"\n        ),', text, flags=re.S)
          text3, n2 = re.subn(r'\s*\.plugin\(\s*name:\s*"CompileMetalShaders",\s*capability:\s*\.buildTool\(\)\s*\),', '', text2, flags=re.S)
          if n1 != 1 or n2 != 1: raise SystemExit(f'Unexpected RifeMetal manifest layout: target patches={n1}, plugin patches={n2}')
          pkg.write_text(text3)
          warp = Path('Vendor/rife-metal/Sources/RifeMetalCore/BackwardWarpKernel.swift')
          if 'device.makeDefaultLibrary(bundle: Bundle.module)' not in warp.read_text(): raise SystemExit('Expected Bundle.module shader loader not found')
          PY

      - name: Disable auto-save and keep manual Share output
        run: |
          python3 - <<'PY'
          from pathlib import Path

          vm = Path('VideoProcessorViewModel.swift')
          text = vm.read_text()
          old = '''                await MainActor.run { [weak self] in self?.statusText = "Saving to Files…"; self?.progress = 0.995 }
                RecoveryStore.update(progress: 0.995, message: "Saving finished result to Files", force: true)
                guard let self else { return }
                let saved = try await self.saveFinishedVideo(result)
                RecoveryStore.finishAndClean()
                await MainActor.run { [weak self] in
                    guard let self else { return }
                    self.outputURL = saved.url
                    self.saveStatusText = saved.message
'''
          new = '''                await MainActor.run { [weak self] in self?.statusText = "Finalizing output…"; self?.progress = 0.995 }
                RecoveryStore.update(progress: 0.995, message: "Finalizing finished result for manual export", force: true)
                guard let self else { return }
                try await self.validateFinishedVideo(result)
                let fm = FileManager.default
                let manualDir = fm.urls(for: .cachesDirectory, in: .userDomainMask)[0].appendingPathComponent("ManualExport", isDirectory: true)
                try fm.createDirectory(at: manualDir, withIntermediateDirectories: true)
                let ext = result.pathExtension.isEmpty ? "mov" : result.pathExtension
                let manualURL = manualDir.appendingPathComponent("RIFE60-Finished.\\(ext)")
                try? fm.removeItem(at: manualURL)
                try fm.copyItem(at: result, to: manualURL)
                try await self.validateFinishedVideo(manualURL)
                DiagnosticsLogger.shared.log("Auto-save disabled • finished output retained internally for manual Share: \\(manualURL.path)")
                RecoveryStore.finishAndClean()
                await MainActor.run { [weak self] in
                    guard let self else { return }
                    self.outputURL = manualURL
                    self.saveStatusText = "Auto-save disabled • use Share Output to save or share the finished video"
'''
          if old not in text: raise SystemExit('Could not locate auto-save completion block')
          vm.write_text(text.replace(old, new, 1))

          view = Path('ContentView.swift')
          ui = view.read_text()
          old_ui = '''                    Section("Export to Files") {
                        LabeledContent("Final codec", value: "HEVC Main10")
                        LabeledContent("Pixel format", value: "10-bit P010")
                        LabeledContent("File-size target", value: "< 1 GB")
                        Toggle("Preserve original audio", isOn: $vm.preserveAudio).disabled(vm.recoveryAvailable)
                        LabeledContent("Auto-save folder", value: vm.exportFolderName)
                        Button { showingExportFolderPicker = true } label: { Label("Choose Files Export Folder", systemImage: "folder.badge.plus") }
                        Button("Use Default App Export Folder") { vm.useDefaultExportFolder() }
                        Text("Finished videos are automatically copied into this Files folder. Choose a folder once and the app remembers it for future renders. This avoids the Photos import issue and means you no longer need to use Copy/Paste to get the finished video into Files.").font(.caption).foregroundStyle(.secondary)
                    }
'''
          new_ui = '''                    Section("Export") {
                        LabeledContent("Final codec", value: "HEVC Main10")
                        LabeledContent("Pixel format", value: "10-bit P010")
                        LabeledContent("File-size target", value: "< 1 GB")
                        Toggle("Preserve original audio", isOn: $vm.preserveAudio).disabled(vm.recoveryAvailable)
                        LabeledContent("Auto-save", value: "Disabled")
                        Text("The app will not automatically save finished videos to Photos or Files. When processing finishes, use Share Output and choose Save to Files, Save Video, AirDrop, or another destination yourself.").font(.caption).foregroundStyle(.secondary)
                    }
'''
          if old_ui not in ui: raise SystemExit('Could not locate auto-save UI block')
          view.write_text(ui.replace(old_ui, new_ui, 1))
          PY

      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project RIFE60GhostGuard.xcodeproj -scheme RIFE60GhostGuard
      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -project RIFE60GhostGuard.xcodeproj -scheme RIFE60GhostGuard -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build | tee xcodebuild.log

      - name: Create verified IPA with Sharpie and both Real-CUGAN profiles
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RIFE60GhostGuard.app Payload/
          cp -R Models/AnimeSharpieOutlineSubtle.mlpackage Payload/RIFE60GhostGuard.app/
          cp -R CompiledModels/RealCUGAN2xNoise3_Tile512.mlmodelc Payload/RIFE60GhostGuard.app/
          cp -R CompiledModels/RealCUGAN2xNoise3_Tile704x608.mlmodelc Payload/RIFE60GhostGuard.app/
          test -f Payload/RIFE60GhostGuard.app/AnimeSharpieOutlineSubtle.mlpackage/Manifest.json
          SHARPIE_WEIGHT=$(find Payload/RIFE60GhostGuard.app/AnimeSharpieOutlineSubtle.mlpackage -type f -name 'weight.bin' -print -quit)
          test -n "$SHARPIE_WEIGHT"
          test -s "$SHARPIE_WEIGHT"
          test -d Payload/RIFE60GhostGuard.app/RealCUGAN2xNoise3_Tile512.mlmodelc
          test -d Payload/RIFE60GhostGuard.app/RealCUGAN2xNoise3_Tile704x608.mlmodelc
          test -f Payload/RIFE60GhostGuard.app/Info.plist
          echo "Verified Sharpie: $SHARPIE_WEIGHT"
          echo "Verified Real-CUGAN 512 fallback + 704x608 fast profile"
          zip -qry RIFE60GhostGuard-verified-unsigned.ipa Payload
          unzip -t RIFE60GhostGuard-verified-unsigned.ipa >/dev/null

      - name: Upload verified IPA
        uses: actions/upload-artifact@v4
        with:
          name: RIFE60GhostGuard-verified-unsigned-ipa
          path: RIFE60GhostGuard-verified-unsigned.ipa
          retention-days: 30
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

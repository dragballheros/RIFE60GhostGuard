name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Vendor and patch RifeMetal
        run: |
          rm -rf Vendor/rife-metal
          mkdir -p Vendor
          git clone --depth 1 https://github.com/cinemore/rife-metal.git Vendor/rife-metal
          python3 - <<'PY'
          from pathlib import Path
          import re

          pkg = Path('Vendor/rife-metal/Package.swift')
          text = pkg.read_text()

          text2, n1 = re.subn(
              r'\.target\(\s*name:\s*"RifeMetalCore",\s*exclude:\s*\["Shaders"\],\s*plugins:\s*\[\.plugin\(name:\s*"CompileMetalShaders"\)\]\s*\),',
              '.target(\n            name: "RifeMetalCore"\n        ),',
              text,
              flags=re.S,
          )
          text3, n2 = re.subn(
              r'\s*\.plugin\(\s*name:\s*"CompileMetalShaders",\s*capability:\s*\.buildTool\(\)\s*\),',
              '',
              text2,
              flags=re.S,
          )
          if n1 != 1 or n2 != 1:
              print(text)
              raise SystemExit(f'Unexpected RifeMetal manifest layout: target patches={n1}, plugin patches={n2}')
          pkg.write_text(text3)

          # Keep RifeMetal's original Bundle.module shader lookup. Xcode now compiles the
          # .metal files into the RifeMetalCore resource bundle, so Bundle.module is the
          # correct runtime location for default.metallib on iOS.
          warp = Path('Vendor/rife-metal/Sources/RifeMetalCore/BackwardWarpKernel.swift')
          w = warp.read_text()
          needle = 'device.makeDefaultLibrary(bundle: Bundle.module)'
          count = w.count(needle)
          if count < 1:
              raise SystemExit('Expected Bundle.module shader loader not found')
          print(f'Keeping {count} Bundle.module shader loader call(s) unchanged')
          PY

          echo '--- patched Package.swift ---'
          cat Vendor/rife-metal/Package.swift
          echo '--- makeDefaultLibrary references ---'
          grep -n 'makeDefaultLibrary' Vendor/rife-metal/Sources/RifeMetalCore/BackwardWarpKernel.swift

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project RIFE60GhostGuard.xcodeproj \
            -scheme RIFE60GhostGuard

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild \
            -project RIFE60GhostGuard.xcodeproj \
            -scheme RIFE60GhostGuard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee xcodebuild.log

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R \
            build/Build/Products/Release-iphoneos/RIFE60GhostGuard.app \
            Payload/
          zip -qry RIFE60GhostGuard-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RIFE60GhostGuard-unsigned-ipa
          path: RIFE60GhostGuard-unsigned.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

name: Build Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project RIFE60GhostGuard.xcodeproj \
            -scheme RIFE60GhostGuard

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project RIFE60GhostGuard.xcodeproj \
            -scheme RIFE60GhostGuard \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R \
            build/Build/Products/Release-iphoneos/RIFE60GhostGuard.app \
            Payload/

          zip -qry RIFE60GhostGuard-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RIFE60GhostGuard-unsigned-ipa
          path: RIFE60GhostGuard-unsigned.ipa

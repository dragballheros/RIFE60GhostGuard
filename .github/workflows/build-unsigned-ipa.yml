name: Build Unsigned IPA

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Rebuild trigger after reverting mobile compression restoration
# Color Pop skin-state preservation fix build trigger
# Pause-only checkpoint baseline build
# Regular image AVIF export build
# CI validation trigger

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch pinned on-device diffusion engine
        run: |
          set -euo pipefail
          git clone https://github.com/drawthingsai/draw-things-community.git Vendor/draw-things-community
          git -C Vendor/draw-things-community checkout 4f288803ac898525012c0fe8d998c85bcb920b70
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Vendor/draw-things-community/Package.swift")
          source = path.read_text()
          needle = '    .library(name: "_MediaGenerationKit", targets: ["_MediaGenerationKit"]),'
          addition = '''    .library(name: "_MediaGenerationKit", targets: ["_MediaGenerationKit"]),
              .library(name: "DrawThingsCLILib", targets: ["DrawThingsCLILib"]),
              .library(name: "DataModels", targets: ["DataModels"]),'''
          if source.count(needle) != 1:
              raise SystemExit("Pinned Draw Things package layout changed. Inspect Package.swift before updating the patch.")
          path.write_text(source.replace(needle, addition))
          PY
      - name: Validate pinned model ID and package patch prerequisites
        run: |
          grep -q 'animagine_xl_v3.1_q6p_q8p.ckpt' OnDeviceImageGenerator.swift
          test -f Vendor/draw-things-community/Package.swift
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Prepare permanent Sharpie model
        run: |
          set -euo pipefail
          test -f SharpieModel.mlpackage.zip
          rm -rf /tmp/sharpie-unpack Models/AnimeSharpieOutlineSubtle.mlpackage
          mkdir -p /tmp/sharpie-unpack Models
          unzip -q SharpieModel.mlpackage.zip -d /tmp/sharpie-unpack
          SHARPIE_PACKAGE=$(find /tmp/sharpie-unpack -type f -name Manifest.json -print -quit | xargs dirname)
          test -n "$SHARPIE_PACKAGE"
          cp -R "$SHARPIE_PACKAGE" Models/AnimeSharpieOutlineSubtle.mlpackage
          test -f Models/AnimeSharpieOutlineSubtle.mlpackage/Manifest.json
          SHARPIE_WEIGHT=$(find Models/AnimeSharpieOutlineSubtle.mlpackage -type f -name 'weight.bin' -print -quit)
          test -n "$SHARPIE_WEIGHT"
          test -s "$SHARPIE_WEIGHT"

      - name: Restore stable Real-CUGAN model cache
        uses: actions/cache@v4
        with:
          path: |
            Models/RealCUGAN2xNoise3_Tile512.mlpackage
            Models/RealCUGAN2xNoise3_Tile704x608.mlpackage
            CompiledModels/RealCUGAN2xNoise3_Tile512.mlmodelc
            CompiledModels/RealCUGAN2xNoise3_Tile704x608.mlmodelc
          key: realcugan-noise3-fp16-512-and-704x608-v1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare stable Real-CUGAN source models if needed
        run: |
          set -euo pipefail
          NEED512=0
          NEED704=0
          test -f Models/RealCUGAN2xNoise3_Tile512.mlpackage/Manifest.json || NEED512=1
          test -f Models/RealCUGAN2xNoise3_Tile704x608.mlpackage/Manifest.json || NEED704=1
          if [ "$NEED512" = 1 ] || [ "$NEED704" = 1 ]; then
            python -m pip install --upgrade pip
            python -m pip install 'torch==2.5.0' 'coremltools==8.3' 'numpy==1.26.4'
            rm -rf /tmp/video_upscale /tmp/realcugan-weights
            git clone --depth 1 https://github.com/apleynes/video_upscale_mac_silicon.git /tmp/video_upscale
            mkdir -p /tmp/realcugan-weights Models
            curl -L --fail --retry 3 -o /tmp/updated_weights.zip https://github.com/bilibili/ailab/releases/download/Real-CUGAN/updated_weights.zip
            unzip -q /tmp/updated_weights.zip -d /tmp/realcugan-weights
            WEIGHT=$(find /tmp/realcugan-weights -name 'up2x-latest-denoise3x.pth' -print -quit)
            test -n "$WEIGHT"
            if [ "$NEED512" = 1 ]; then
              REALCUGAN_DIR=/tmp/video_upscale/realcugan/Real-CUGAN REALCUGAN_WEIGHT="$WEIGHT" REALCUGAN_TILE_WIDTH=512 REALCUGAN_TILE_HEIGHT=512 REALCUGAN_OUT=Models/RealCUGAN2xNoise3_Tile512.mlpackage python Scripts/export_realcugan_1080p.py
            fi
            if [ "$NEED704" = 1 ]; then
              REALCUGAN_DIR=/tmp/video_upscale/realcugan/Real-CUGAN REALCUGAN_WEIGHT="$WEIGHT" REALCUGAN_TILE_WIDTH=704 REALCUGAN_TILE_HEIGHT=608 REALCUGAN_OUT=Models/RealCUGAN2xNoise3_Tile704x608.mlpackage python Scripts/export_realcugan_1080p.py
            fi
          fi
          test -f Models/RealCUGAN2xNoise3_Tile512.mlpackage/Manifest.json
          test -f Models/RealCUGAN2xNoise3_Tile704x608.mlpackage/Manifest.json

      - name: Compile stable Real-CUGAN models for iOS if needed
        run: |
          set -euo pipefail
          mkdir -p CompiledModels
          if [ ! -d CompiledModels/RealCUGAN2xNoise3_Tile512.mlmodelc ]; then xcrun coremlcompiler compile Models/RealCUGAN2xNoise3_Tile512.mlpackage CompiledModels; fi
          if [ ! -d CompiledModels/RealCUGAN2xNoise3_Tile704x608.mlmodelc ]; then xcrun coremlcompiler compile Models/RealCUGAN2xNoise3_Tile704x608.mlpackage CompiledModels; fi
          test -d CompiledModels/RealCUGAN2xNoise3_Tile512.mlmodelc
          test -d CompiledModels/RealCUGAN2xNoise3_Tile704x608.mlmodelc

      - name: Restore anime inpainting model cache
        uses: actions/cache@v4
        with:
          path: |
            Models/AnimeWatermarkLaMa512.mlpackage
            CompiledModels/AnimeWatermarkLaMa512.mlmodelc
          key: anime-lama-29f284f36a0a510bcacf39ecf4c4d54f-fp32-512-ios16-v1

      - name: Prepare verified anime inpainting model
        run: |
          set -euo pipefail
          if [ ! -f Models/AnimeWatermarkLaMa512.mlpackage/Manifest.json ]; then
            python -m pip install 'torch==2.5.0' 'coremltools==8.3.0' 'numpy==1.26.4'
            curl -L --fail --retry 3 -o /tmp/anime-manga-big-lama.pt https://github.com/Sanster/models/releases/download/AnimeMangaInpainting/anime-manga-big-lama.pt
            python Scripts/export_anime_inpaint.py
          fi
          mkdir -p CompiledModels
          if [ ! -d CompiledModels/AnimeWatermarkLaMa512.mlmodelc ]; then
            xcrun coremlcompiler compile Models/AnimeWatermarkLaMa512.mlpackage CompiledModels
          fi
          test -d CompiledModels/AnimeWatermarkLaMa512.mlmodelc

      - name: Generate professional app icon
        run: |
          rm -rf Assets.xcassets
          swift Scripts/generate_app_icon.swift
          test -f Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

      - name: Vendor and patch RifeMetal
        run: |
          rm -rf Vendor/rife-metal
          mkdir -p Vendor
          git clone --depth 1 https://github.com/cinemore/rife-metal.git Vendor/rife-metal
          python3 - <<'PY'
          from pathlib import Path
          import re
          pkg = Path('Vendor/rife-metal/Package.swift')
          text = pkg.read_text()
          text2, n1 = re.subn(r'\.target\(\s*name:\s*"RifeMetalCore",\s*exclude:\s*\["Shaders"\],\s*plugins:\s*\[\.plugin\(name:\s*"CompileMetalShaders"\)\]\s*\),', '.target(\n            name: "RifeMetalCore"\n        ),', text, flags=re.S)
          text3, n2 = re.subn(r'\s*\.plugin\(\s*name:\s*"CompileMetalShaders",\s*capability:\s*\.buildTool\(\)\s*\),', '', text2, flags=re.S)
          if n1 != 1 or n2 != 1: raise SystemExit(f'Unexpected RifeMetal manifest layout: {n1}, {n2}')
          pkg.write_text(text3)
          PY

      - name: Enable safe idle RIFE graph reclamation
        run: python3 Scripts/patch_rife_idle_graph.py

      - name: Apply automatic cooled Performance Mode
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new, count=None):
              p = Path(path)
              s = p.read_text()
              found = s.count(old)
              if found == 0:
                  raise SystemExit(f'Performance patch target missing in {path}: {old[:80]!r}')
              if count is not None and found != count:
                  raise SystemExit(f'Unexpected Performance patch count in {path}: expected {count}, found {found}')
              s = s.replace(old, new)
              p.write_text(s)

          # RIFE: keep HQ/model/timesteps unchanged. At Nominal/Fair poll the
          # hardware writer more aggressively, yield less, and retain buffers
          # longer so the Metal stream is fed with less CPU-side interruption.
          replace_required(
              'RIFEVideoProcessor.swift',
              'try await Task.sleep(nanoseconds: 2_000_000)',
              'try await Task.sleep(nanoseconds: automaticPerformanceModeEnabled() ? 250_000 : 2_000_000)',
              1
          )
          replace_required(
              'RIFEVideoProcessor.swift',
              'await Task.yield()',
              'if !automaticPerformanceModeEnabled() { await Task.yield() }',
              1
          )
          # Pause-checkpoint RIFE owns its writer pixel-buffer pool; no external flush patch is applied here.

          PY

      - name: Verify Color Pop bypass and color patches
        run: |
          set -euo pipefail
          mkdir -p /tmp/color-pop-check
          cp Scripts/check_color_pop.swift /tmp/color-pop-check/main.swift
          swiftc -swift-version 5 ColorPopGrade.swift /tmp/color-pop-check/main.swift -o /tmp/color-pop-check/check
          /tmp/color-pop-check/check

      - name: Verify anime inpainting inference and mask geometry
        run: |
          set -euo pipefail
          mkdir -p /tmp/anime-inpaint-check
          cp Scripts/check_anime_inpaint.swift /tmp/anime-inpaint-check/main.swift
          swiftc -swift-version 5 WatermarkConfiguration.swift WatermarkBrushMask.swift AnimeWatermarkRemover.swift /tmp/anime-inpaint-check/main.swift -o /tmp/anime-inpaint-check/check
          /tmp/anime-inpaint-check/check CompiledModels/AnimeWatermarkLaMa512.mlmodelc

      - name: Verify speed options and checkpoint planning
        run: |
          set -euo pipefail
          mkdir -p /tmp/speed-options-check
          cp Scripts/check_speed_options.swift /tmp/speed-options-check/main.swift
          swiftc -swift-version 5 ModelComputePreference.swift UpscaleFirstPlan.swift RIFEBandPlan.swift /tmp/speed-options-check/main.swift -o /tmp/speed-options-check/check
          /tmp/speed-options-check/check

      - name: Verify adaptive RIFE band mapping and resource lifecycle
        run: |
          set -euo pipefail
          mkdir -p /tmp/adaptive-rife-check
          swiftc -swift-version 5 -emit-module -emit-library -module-name RifeMetal Scripts/MockRifeMetal.swift -emit-module-path /tmp/adaptive-rife-check/RifeMetal.swiftmodule -o /tmp/adaptive-rife-check/libRifeMetal.dylib
          cp Scripts/check_adaptive_rife.swift /tmp/adaptive-rife-check/main.swift
          swiftc -swift-version 5 -I /tmp/adaptive-rife-check -L /tmp/adaptive-rife-check -lRifeMetal TiledHQInterpolator.swift RIFEBandPlan.swift /tmp/adaptive-rife-check/main.swift -o /tmp/adaptive-rife-check/check
          DYLD_LIBRARY_PATH=/tmp/adaptive-rife-check /tmp/adaptive-rife-check/check

      - name: Verify persistent mixed media queue and strict serial scheduling
        run: |
          set -euo pipefail
          mkdir -p /tmp/batch-media-check
          swiftc -swift-version 5 -parse-as-library WatermarkConfiguration.swift WatermarkBrushMask.swift BatchMediaQueue.swift Scripts/check_batch_media.swift -o /tmp/batch-media-check/check
          /tmp/batch-media-check/check

      - name: Generate Xcode project
        run: xcodegen generate
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project RIFE60GhostGuard.xcodeproj -scheme RIFE60GhostGuard
      - name: Patch optional Core ML Int8 ANE path for Xcode 16.4
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("build/SourcePackages/checkouts/ccv/lib/nnc/mfa/ccv_nnc_mfa_ane_rowwise_coreml.mm")
          source = path.read_text()
          marker = "#import <Metal/Metal.h>\\n"
          if source.count(marker) != 1:
              raise SystemExit("Unexpected ccv Core ML source layout; do not apply a blind compatibility patch.")
          source = source.replace(
              marker,
              marker + "\\n// RIFE60 compatibility: the Xcode 16.4 SDK has no MLMultiArrayDataTypeInt8.\\n"
                       "#define CCV_HAS_ML_INT8_MULTARRAY 0\\n",
              1,
          )

          byte_case = "    case MLMultiArrayDataTypeInt8:\\n      return sizeof(int8_t);"
          if source.count(byte_case) != 1:
              raise SystemExit("Expected one Int8 byte-size case.")
          source = source.replace(
              byte_case,
              "#if CCV_HAS_ML_INT8_MULTARRAY\\n" + byte_case + "\\n#endif",
              1,
          )

          pixel_case = "    case MLMultiArrayDataTypeInt8:\\n      return kCVPixelFormatType_OneComponent8;"
          if source.count(pixel_case) != 1:
              raise SystemExit("Expected one Int8 pixel-format case.")
          source = source.replace(
              pixel_case,
              "#if CCV_HAS_ML_INT8_MULTARRAY\\n" + pixel_case + "\\n#endif",
              1,
          )

          compile_start = source.index("static std::unique_ptr<CompiledProgram> compile_program(")
          compile_end = source.index("\\n} // namespace", compile_start)
          compile_body = source[compile_start:compile_end].rstrip()
          compile_stub = """static std::unique_ptr<CompiledProgram> compile_program(
              const uint32_t padded_M,
              const uint32_t N,
              const uint32_t K,
              std::string* const error_out)
          {
            (void)padded_M;
            (void)N;
            (void)K;
            if (error_out)
              *error_out = "Core ML Int8 rowwise path is unavailable with this SDK";
            return {};
          }"""
          source = (
              source[:compile_start]
              + "#if CCV_HAS_ML_INT8_MULTARRAY\\n"
              + compile_body
              + "\\n#else\\n"
              + compile_stub
              + "\\n#endif\\n"
              + source[compile_end:]
          )

          scratch_start = source.index("int ccv_nnc_mfa_ane_rowwise_coreml_cache_ensure_scratch(")
          scratch_end = source.index(
              "\\nmtl_buffer_t* ccv_nnc_mfa_ane_rowwise_coreml_cache_activation_surface_buffer(",
              scratch_start,
          )
          scratch_body = source[scratch_start:scratch_end].rstrip()
          scratch_stub = """int ccv_nnc_mfa_ane_rowwise_coreml_cache_ensure_scratch(
              ccv_nnc_mfa_ane_rowwise_coreml_cache_t* cache,
              uint32_t padded_M,
              uint32_t N,
              uint32_t K,
              char* error_out,
              size_t error_out_size)
          {
            (void)cache;
            (void)padded_M;
            (void)N;
            (void)K;
            set_error(error_out, error_out_size,
                      "Core ML Int8 rowwise path is unavailable with this SDK");
            return 0;
          }"""
          source = (
              source[:scratch_start]
              + "#if CCV_HAS_ML_INT8_MULTARRAY\\n"
              + scratch_body
              + "\\n#else\\n"
              + scratch_stub
              + "\\n#endif\\n"
              + source[scratch_end:]
          )

          path.write_text(source)
          print("Patched optional Core ML Int8 ANE path; the normal Metal fallback remains enabled.")
          PY

      - name: Build unsigned app
        run: |
          set -o pipefail
          xcodebuild -project RIFE60GhostGuard.xcodeproj -scheme RIFE60GhostGuard -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build | tee xcodebuild.log

      - name: Create verified IPA
        run: |
          set -euo pipefail
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RIFE60GhostGuard.app Payload/
          cp -R Models/AnimeSharpieOutlineSubtle.mlpackage Payload/RIFE60GhostGuard.app/
          cp -R CompiledModels/RealCUGAN2xNoise3_Tile512.mlmodelc Payload/RIFE60GhostGuard.app/
          cp -R CompiledModels/RealCUGAN2xNoise3_Tile704x608.mlmodelc Payload/RIFE60GhostGuard.app/
          cp -R CompiledModels/AnimeWatermarkLaMa512.mlmodelc Payload/RIFE60GhostGuard.app/
          cp ThirdPartyNotices-AnimeWatermark.md Payload/RIFE60GhostGuard.app/
          cp Licenses/LaMa-Apache-2.0.txt Payload/RIFE60GhostGuard.app/
          test -d Payload/RIFE60GhostGuard.app/AnimeWatermarkLaMa512.mlmodelc
          test -f Payload/RIFE60GhostGuard.app/AnimeSharpieOutlineSubtle.mlpackage/Manifest.json
          SHARPIE_WEIGHT=$(find Payload/RIFE60GhostGuard.app/AnimeSharpieOutlineSubtle.mlpackage -type f -name 'weight.bin' -print -quit)
          test -n "$SHARPIE_WEIGHT"
          test -s "$SHARPIE_WEIGHT"
          test -d Payload/RIFE60GhostGuard.app/RealCUGAN2xNoise3_Tile512.mlmodelc
          test -d Payload/RIFE60GhostGuard.app/RealCUGAN2xNoise3_Tile704x608.mlmodelc
          zip -qry RIFE60GhostGuard-verified-unsigned.ipa Payload
          unzip -t RIFE60GhostGuard-verified-unsigned.ipa >/dev/null

      - name: Upload verified IPA
        uses: actions/upload-artifact@v4
        with:
          name: RIFE60GhostGuard-verified-unsigned-ipa
          path: RIFE60GhostGuard-verified-unsigned.ipa
          retention-days: 30
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore

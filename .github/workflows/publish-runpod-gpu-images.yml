name: Publish RunPod GPU Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloud/runpod-comfyui-worker/**"
      - "cloud/anima-lora-trainer/**"
      - ".github/workflows/publish-runpod-gpu-images.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish-comfyui-worker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ComfyUI worker
        uses: docker/build-push-action@v6
        with:
          context: ./cloud/runpod-comfyui-worker
          file: ./cloud/runpod-comfyui-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/dragballheros/rife60-comfyui-worker:latest
            ghcr.io/dragballheros/rife60-comfyui-worker:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/dragballheros/RIFE60GhostGuard
            org.opencontainers.image.description=RunPod ComfyUI worker with current diffusion_models and text_encoders volume mappings
          cache-from: type=gha,scope=rife60-comfyui-worker
          cache-to: type=gha,mode=max,scope=rife60-comfyui-worker

  publish-anima-trainer:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish ANIMA LoRA trainer
        uses: docker/build-push-action@v6
        with:
          context: ./cloud/anima-lora-trainer
          file: ./cloud/anima-lora-trainer/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/dragballheros/rife60-anima-lora-trainer:latest
            ghcr.io/dragballheros/rife60-anima-lora-trainer:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/dragballheros/RIFE60GhostGuard
            org.opencontainers.image.description=Authenticated ANIMA LoRA trainer API for RIFE60GhostGuard
          cache-from: type=gha,scope=rife60-anima-lora-trainer
          cache-to: type=gha,mode=max,scope=rife60-anima-lora-trainer

name: Wan VACE Selective Region Planner Tests

on:
  workflow_dispatch:
  push:
    branches:
      - feature/wan-vace-iphone-memory-first
    paths:
      - "VACESelectiveRegionPlanner.swift"
      - "VACEConditioningBuilder.swift"
      - "VACESelectiveVideoPipeline.swift"
      - "VACEOpticalFlowMaskWarp.swift"
      - "VACEOpticalFlowMaskProvider.swift"
      - "Scripts/test_vace_selective_region_planner.swift"
      - ".github/workflows/wan-vace-selective-region-check.yml"

permissions:
  contents: read

concurrency:
  group: wan-vace-selective-region-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selective-region:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse implementation
        run: swiftc -frontend -parse VACESelectiveRegionPlanner.swift VACEConditioningBuilder.swift VACESelectiveVideoPipeline.swift VACEOpticalFlowMaskWarp.swift VACEOpticalFlowMaskProvider.swift
      - name: Typecheck against iOS 16 SDK
        run: |
          xcrun --sdk iphoneos swiftc \
            -swift-version 5 \
            -target arm64-apple-ios16.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -typecheck VACESelectiveRegionPlanner.swift VACEConditioningBuilder.swift VACESelectiveVideoPipeline.swift VACEOpticalFlowMaskWarp.swift VACEOpticalFlowMaskProvider.swift -framework AVFoundation -framework CoreVideo -framework Vision
      - name: Compile and run algorithm tests
        run: |
          swiftc -swift-version 5 VACESelectiveRegionPlanner.swift VACEConditioningBuilder.swift VACEOpticalFlowMaskWarp.swift Scripts/test_vace_selective_region_planner.swift -o /tmp/vace-region-tests
          /tmp/vace-region-tests

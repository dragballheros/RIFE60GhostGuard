name: Wan VACE Transformer Block Core ML Parity

on:
  workflow_dispatch:
  push:
    branches:
      - feature/wan-vace-iphone-memory-first
    paths:
      - "Scripts/probe_vace_block_coreml.py"
      - "Scripts/probe_wan_base_block_coreml.py"
      - "Scripts/test_vace_checkpoint_mapping.py"
      - ".github/workflows/wan-vace-block-coreml-parity.yml"
      - "Docs/WanVACE-iPhone-Memory-First-Implementation.md"

permissions:
  contents: read

concurrency:
  group: wan-vace-block-coreml-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vace-block-parity:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'torch==2.5.1' \
            'coremltools==9.0' \
            'numpy==1.26.4' \
            'diffusers==0.32.2' \
            einops easydict
      - name: Check converter and mapping-test syntax
        run: |
          python -m py_compile Scripts/probe_vace_block_coreml.py Scripts/probe_wan_base_block_coreml.py Scripts/test_vace_checkpoint_mapping.py
      - name: Test Diffusers-to-original checkpoint key mapping without large model downloads
        run: python Scripts/test_vace_checkpoint_mapping.py
      - name: Fetch pinned official Wan2.1 source
        run: |
          set -euo pipefail
          git clone https://github.com/Wan-Video/Wan2.1.git Vendor/Wan2.1
          git -C Vendor/Wan2.1 checkout 9737cba9c1c3c4d04b33fcad41c111989865d315
          test "$(git -C Vendor/Wan2.1 rev-parse HEAD)" = "9737cba9c1c3c4d04b33fcad41c111989865d315"
      - name: Convert and test iOS 16-compatible VACE block with INT8 weights
        run: |
          python Scripts/probe_vace_block_coreml.py \
            --wan-repo Vendor/Wan2.1 \
            --minimum-deployment-target ios16 \
            --quantization-levels int8 \
            --output /tmp/VACEBlock-1p3B-iOS16.mlpackage \
            --report /tmp/VACEBlock-1p3B-iOS16.validation.json
      - name: Convert and test iOS 18 VACE block with INT8 and INT4 weights
        run: |
          python Scripts/probe_vace_block_coreml.py \
            --wan-repo Vendor/Wan2.1 \
            --minimum-deployment-target ios18 \
            --quantization-levels int8 int4 \
            --output /tmp/VACEBlock-1p3B-iOS18.mlpackage \
            --report /tmp/VACEBlock-1p3B-iOS18.validation.json
      - name: Download pinned official VACE 1.3B checkpoint for explicit trained-weight run
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[vace-trained]')
        run: |
          set -euo pipefail
          curl --location --fail --retry 3 --retry-all-errors \
            'https://huggingface.co/Wan-AI/Wan2.1-VACE-1.3B/resolve/ae5437bcd803e960d99fd901c15f065d3e94a86a/diffusion_pytorch_model.safetensors?download=true' \
            --output /tmp/Wan2.1-VACE-1.3B.safetensors
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path

          checkpoint = Path("/tmp/Wan2.1-VACE-1.3B.safetensors")
          expected = "c46a6f5f7d32c453c3983bbc59761ea41cd02ad584fb55d1a7ee2b76145847a2"
          digest = sha256()
          with checkpoint.open("rb") as stream:
              for chunk in iter(lambda: stream.read(8 * 1024 * 1024), b""):
                  digest.update(chunk)
          actual = digest.hexdigest()
          print(f"Checkpoint SHA-256: {actual}")
          if actual != expected:
              raise SystemExit(f"SHA-256 mismatch: expected {expected}, got {actual}")
          print(f"Verified pinned checkpoint: {checkpoint.stat().st_size} bytes")
          PY
      - name: Convert trained VACE control block 0 and measure INT8 versus INT4
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[vace-trained]')
        run: |
          python Scripts/probe_vace_block_coreml.py \
            --wan-repo Vendor/Wan2.1 \
            --checkpoint /tmp/Wan2.1-VACE-1.3B.safetensors \
            --block-index 0 \
            --minimum-deployment-target ios18 \
            --quantization-levels int8 int4 \
            --output /tmp/VACEBlock-Index00-trained-iOS18.mlpackage \
            --report /tmp/VACEBlock-Index00-trained-iOS18.validation.json
      - name: Convert a second trained VACE control block without input projection
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[vace-trained]')
        run: |
          python Scripts/probe_vace_block_coreml.py \
            --wan-repo Vendor/Wan2.1 \
            --checkpoint /tmp/Wan2.1-VACE-1.3B.safetensors \
            --block-index 1 \
            --minimum-deployment-target ios18 \
            --quantization-levels int8 \
            --output /tmp/VACEBlock-Index01-trained-iOS18.mlpackage \
            --report /tmp/VACEBlock-Index01-trained-iOS18.validation.json
      - name: Convert a trained base block with its VACE hint input
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[vace-trained]')
        run: |
          python Scripts/probe_wan_base_block_coreml.py \
            --wan-repo Vendor/Wan2.1 \
            --checkpoint /tmp/Wan2.1-VACE-1.3B.safetensors \
            --block-index 0 \
            --num-layers 30 \
            --quantization-levels int8 \
            --output /tmp/WanBaseBlock-Index00-trained-iOS18.mlpackage \
            --report /tmp/WanBaseBlock-Index00-trained-iOS18.validation.json
      - name: Convert a trained base block without a VACE hint
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[vace-trained]')
        run: |
          python Scripts/probe_wan_base_block_coreml.py \
            --wan-repo Vendor/Wan2.1 \
            --checkpoint /tmp/Wan2.1-VACE-1.3B.safetensors \
            --block-index 1 \
            --num-layers 30 \
            --quantization-levels int8 \
            --output /tmp/WanBaseBlock-Index01-trained-iOS18.mlpackage \
            --report /tmp/WanBaseBlock-Index01-trained-iOS18.validation.json
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wan-vace-block-coreml-validation-reports
          path: /tmp/*Block-*.validation.json
          if-no-files-found: warn
          retention-days: 14

name: Wan VACE Transformer Block Core ML Parity

on:
  workflow_dispatch:
  push:
    branches:
      - feature/wan-vace-iphone-memory-first
    paths:
      - "Scripts/probe_vace_block_coreml.py"
      - ".github/workflows/wan-vace-block-coreml-parity.yml"
      - "Docs/WanVACE-iPhone-Memory-First-Implementation.md"

permissions:
  contents: read

concurrency:
  group: wan-vace-block-coreml-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vace-block-parity:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'torch==2.5.1' \
            'coremltools==9.0' \
            'numpy==1.26.4' \
            'diffusers==0.32.2' \
            einops easydict
      - name: Check converter syntax
        run: python -m py_compile Scripts/probe_vace_block_coreml.py
      - name: Fetch pinned official Wan2.1 source
        run: |
          set -euo pipefail
          git clone https://github.com/Wan-Video/Wan2.1.git Vendor/Wan2.1
          git -C Vendor/Wan2.1 checkout 9737cba9c1c3c4d04b33fcad41c111989865d315
          test "$(git -C Vendor/Wan2.1 rev-parse HEAD)" = "9737cba9c1c3c4d04b33fcad41c111989865d315"
      - name: Convert actual VACE conditioning block and validate Core ML parity
        run: |
          python Scripts/probe_vace_block_coreml.py \
            --wan-repo Vendor/Wan2.1 \
            --output /tmp/VACEBlock-1p3B-CoreML.mlpackage \
            --report /tmp/VACEBlock-1p3B-CoreML.validation.json
      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wan-vace-block-coreml-parity-report
          path: /tmp/VACEBlock-1p3B-CoreML.validation.json
          if-no-files-found: warn
          retention-days: 14

name: Republish IPA from Existing Artifact

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run ID containing the verified-unsigned-ipa artifact
        required: true
        default: "38517758976"
  push:
    branches: [main]
    paths:
      - ".github/workflows/republish-ipa-from-artifact.yml"

permissions:
  contents: write
  actions: read

jobs:
  republish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository for GitHub Release publishing
        uses: actions/checkout@v4

      - name: Download existing IPA artifact and verify extracted IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '38517758976' }}
        run: |
          set -euo pipefail
          mkdir -p recovered
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name verified-unsigned-ipa --dir recovered
          IPA_PATH="$(find recovered -type f -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "::error::No IPA found inside the downloaded Actions artifact."
            find recovered -maxdepth 3 -type f -print
            exit 1
          fi
          unzip -t "$IPA_PATH" >/dev/null
          cp "$IPA_PATH" RIFE60GhostGuard-verified-unsigned.ipa
          test -s RIFE60GhostGuard-verified-unsigned.ipa
          echo "Verified IPA size: $(stat -c%s RIFE60GhostGuard-verified-unsigned.ipa) bytes"
          echo "Source Actions run: $SOURCE_RUN_ID"

      - name: Publish temporary GitHub Release with verified IPA
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id || '38517758976' }}
        run: |
          set -euo pipefail
          TAG="ipa-recovered-${SOURCE_RUN_ID}-${GITHUB_RUN_ID}"
          gh release create "$TAG" RIFE60GhostGuard-verified-unsigned.ipa \
            --title "RIFE60GhostGuard verified unsigned IPA" \
            --notes "Raw verified unsigned IPA extracted from the existing GitHub Actions artifact of run ${SOURCE_RUN_ID}. The Actions artifact ZIP remains available separately. This temporary release is deleted 15 minutes after publication."
          URL="$(gh release view "$TAG" --json url --jq .url)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "## Temporary IPA release"
            echo
            echo "Download the raw IPA: [$TAG]($URL)"
            echo
            echo "Source Actions run: ${SOURCE_RUN_ID}"
            echo
            echo "This temporary Release is deleted 15 minutes after publication."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Published verified IPA release: $URL"

      - name: Delete temporary IPA Release after 15 minutes
        if: success() && steps.publish.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.publish.outputs.tag }}
        run: |
          set -euo pipefail
          sleep 900
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag
          echo "Deleted temporary IPA release $RELEASE_TAG after its 15-minute download window."
